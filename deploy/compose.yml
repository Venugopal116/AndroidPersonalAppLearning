services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 100
    environment:
      POSTGRES_DB: personal
      POSTGRES_USER: personal
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    command: ['postgres', '-c', 'shared_buffers=32MB', '-c', 'work_mem=2MB', '-c', 'max_connections=10']
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal -d personal']
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    mem_limit: 448m
    pids_limit: 100
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=32m,mode=1777']
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/personal
      DATABASE_USER: personal
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      REGISTRATION_CODE: ${REGISTRATION_CODE:?Set REGISTRATION_CODE}
      BIND_HOST: 0.0.0.0
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=48m -XX:ActiveProcessorCount=1
    depends_on:
      database:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      GOMEMLIMIT: 64MiB
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
volumes:
  database:
  caddy_data:
  caddy_config: