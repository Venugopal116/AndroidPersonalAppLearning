name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_test
          POSTGRES_USER: personal_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U personal_test -d personal_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pwsh -File scripts/bootstrap-wrapper.ps1
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -PbackendOnly :shared:test :backend:test :backend:installDist --no-daemon
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/personal_test
          POSTGRES_TEST_USER: personal_test
          POSTGRES_TEST_PASSWORD: ci-disposable-only
      - uses: actions/upload-artifact@v4
        with:
          name: backend-distribution
          path: backend/build/install/backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: pwsh -File scripts/bootstrap-wrapper.ps1
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk